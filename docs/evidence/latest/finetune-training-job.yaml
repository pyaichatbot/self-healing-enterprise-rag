apiVersion: batch/v1
kind: Job
metadata:
  name: shrag-finetune-train-20260510-001
  labels:
    app: self-healing-rag
    workload: finetune
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: self-healing-rag
        workload: finetune
    spec:
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.product: "H100"
      containers:
        - name: trainer
          image: "${SHRAG_FINETUNE_TRAINER_IMAGE}"
          imagePullPolicy: IfNotPresent
          env:
            - name: SHRAG_FINETUNE_RUN_ID
              value: "train-20260510-001"
            - name: SHRAG_FINETUNE_DATASET_ID
              value: "engineering-corpus"
            - name: SHRAG_FINETUNE_DATASET_VERSION
              value: "2026.05.10"
            - name: SHRAG_FINETUNE_BASE_MODEL
              value: "llama3.1-70b-instruct"
            - name: SHRAG_FINETUNE_METHOD
              value: "qlora"
            - name: SHRAG_FINETUNE_OUTPUT_MODEL_ID
              value: "eng-assistant-v1"
            - name: SHRAG_FINETUNE_OUTPUT_PATH
              value: ".state/models"
          resources:
            limits:
              nvidia.com/gpu: 4
