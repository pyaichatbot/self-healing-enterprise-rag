apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "self-healing-rag.fullname" . | default "self-healing-rag" }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: self-healing-rag
  template:
    metadata:
      labels:
        app: self-healing-rag
    spec:
      {{- if .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName | quote }}
      {{- end }}
      {{- if .Values.gpu.enabled }}
      nodeSelector:
        {{ .Values.gpu.productLabelKey }}: {{ .Values.gpu.productLabelValue | quote }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
{{ toYaml .Values.resources | indent 12 }}
