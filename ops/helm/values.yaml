replicaCount: 2

image:
  repository: ghcr.io/example/self-healing-rag
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

gpu:
  enabled: false
  count: 1
  resourceName: nvidia.com/gpu
  productLabelKey: nvidia.com/gpu.product
  productLabelValue: NVIDIA-H100
  runtimeClassName: ""

env: []

serviceMonitor:
  enabled: false
